# Worker. Deploy: fly deploy -c fly/worker.toml
#
# Segunda região de monitorização:
#   fly scale count 2 --region mad,ams -c fly/worker.toml
# e definir JELLYCARE_REGION por máquina. A corroboração entre regiões já está
# implementada — ver docs/arquitetura.md.
app = "jellycare-worker"
primary_region = "mad"

[build]
  dockerfile = "../apps/worker/Dockerfile"

[env]
  JELLYCARE_REGION = "eu-west"
  JELLYCARE_CONCURRENCY = "5"

# Sem [http_service]: o worker não serve pedidos. Nunca pode adormecer — tem um
# ciclo de agendamento e uma passagem horária de relatórios.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"

[processes]
  app = "sh -c 'node /app/migrations-pkg/dist/migrate.js && node dist/index.js'"
