# Dashboard. Deploy: fly deploy -c fly/web.toml
app = "jellycare-web"
primary_region = "fra"

[build]
  dockerfile = "../apps/web/Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  # O dashboard pode dormir: quem o abre tolera um arranque de um segundo, e
  # não vale a pena pagar por uma máquina acordada de madrugada.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
