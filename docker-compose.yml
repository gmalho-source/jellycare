# Dependências locais de desenvolvimento.
# Produção usa Postgres gerido (Neon) e Redis gerido — isto é só para a máquina
# de quem desenvolve e para CI.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jellycare
      POSTGRES_PASSWORD: jellycare
      POSTGRES_DB: jellycare
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jellycare"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]

volumes:
  pgdata:
  redisdata:
