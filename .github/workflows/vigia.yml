# O vigia do agendador.
#
# Corre fora do Fly, fora do Redis e fora do worker — de propósito. Um alarme
# que vive dentro da coisa que vigia cala-se ao mesmo tempo que ela. Foi assim
# que uma paragem de dezoito horas passou sem ninguém saber: a plataforma
# tinha a mensagem de erro, repetida catorze mil vezes por minuto, e nenhum
# caminho que a levasse a uma pessoa.
#
# Um job falhado manda email a quem tem o repositório em watch. Não é
# sofisticado e não precisa de ser: precisa de ser independente.
#
# **Não é o alarme principal.** Ver a nota do `schedule` abaixo.
name: Vigia

on:
  schedule:
    # De dez em dez minutos, mas a minutos desencontrados e não a `*/10`.
    #
    # Os agendamentos do Actions são best-effort e a fila é partilhada por
    # toda a plataforma. Os minutos redondos — :00, :10, :20 — são os mais
    # disputados, porque é onde quase toda a gente põe os seus crons. Quando
    # este vigia entrou, não correu uma única vez em mais de setenta minutos
    # com `*/10`; os minutos ímpares e desalinhados caem em fatias mais
    # calmas.
    #
    # Isto reduz o problema, não o resolve. Um alarme cuja própria execução
    # depende de uma fila best-effort tem a propriedade que existe para
    # evitar: se não correr, ninguém sabe. O alarme principal deve ser um
    # serviço de uptime a bater no mesmo endpoint — este workflow é a
    # redundância. Ver docs/operacao.md.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

jobs:
  agendador:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: O agendador está vivo?
        run: |
          set -o pipefail
          corpo=$(mktemp)
          codigo=$(curl -sS --max-time 30 -o "$corpo" -w '%{http_code}' \
            https://jellycare.pt/api/health/scheduler) || {
              echo "::error::Não foi possível falar com o dashboard."
              exit 1
            }

          echo "Resposta ($codigo):"
          cat "$corpo"
          echo

          if [ "$codigo" != "200" ]; then
            echo "::error::O agendador não está saudável (HTTP $codigo). Ver o corpo acima."
            exit 1
          fi

          echo "Agendador vivo."
