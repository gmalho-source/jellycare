# Testes.
#
# Corre a suite inteira contra um Postgres e um Redis reais, que é como ela
# corre localmente: boa parte do que interessa neste produto — reconciliação
# de findings, idempotência dos relatórios, reclamação de pedidos com
# `for update skip locked` — não se prova com uma base de dados falsa.
#
# As portas são as de desenvolvimento de propósito. Assim um teste que leia o
# valor por omissão em vez da variável de ambiente encontra na mesma o
# serviço, e não falha aqui por um motivo que não existe em lado nenhum.
name: Testes

on:
  pull_request:
  # Chamado pelo Deploy. É o que permite ao deploy depender dos testes: o
  # `needs:` não atravessa workflows, e duplicar a definição dos testes num
  # segundo ficheiro era garantir que um dia divergiam.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:55432/jellycare_test
      TEST_REDIS_URL: redis://localhost:56379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A versão tem de ser a mesma que está no package.json e no Dockerfile do
      # worker. Um desencontro dá "Executable doesn't exist" — aqui e em
      # produção.
      - name: Instalar o Chromium
        run: pnpm --filter @jellycare/worker exec playwright install --with-deps chromium

      - name: Criar a base de dados e aplicar migrações
        run: |
          psql postgres://postgres@localhost:55432/postgres -c 'create database jellycare_test'
          for migration in packages/db/migrations/*.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$migration"
          done

      - run: pnpm typecheck

      # O build tem de vir antes dos testes, e não é só para o validar: os
      # testes ponta a ponta do dashboard saltam-se sozinhos quando não
      # encontram o `.next`. Sem este passo, o teste que garante que um
      # cliente não vê os sites de outra organização ficava marcado como
      # "skipped" e ninguém reparava.
      - run: pnpm build

      - run: pnpm test
